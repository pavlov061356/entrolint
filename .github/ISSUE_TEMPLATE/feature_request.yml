name: Feature request
description: Propose a new feature, microstate, detector, or behavior change.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. A few notes before filing:

        - For open-ended ideas, [GitHub Discussions](https://github.com/pavlov061356/entrolint/discussions) is usually a better starting point.
        - Out-of-scope before v1.0: non-Go analyzers (TS planned for v0.5), HTML/heatmap UI (v0.7), anything that needs network I/O, and coverage padding / feature flags / backwards-compat shims for pre-1.0 internal APIs.
        - The roadmap (`ROADMAP.md`) lists planned work — please check whether your idea is already scheduled.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - scan (the hotspot map)
        - check (the ΔS PR gate)
        - formula (S / T / ΔS math, normalization)
        - microstate (cyclomatic / nesting / length / coupling / churn)
        - scaling (O-class detectors)
        - config (.entrolint.yaml, weights, thresholds)
        - tooling (CI, releases, dependencies)
        - docs
        - other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What concrete problem are you hitting? Describe the situation, not the solution.
      placeholder: "When I run check on a large refactor PR, ΔS_density is dominated by reformatting, not by actual structural changes."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: How might this work? CLI flag, new config key, new detector? Pseudocode and examples are welcome.
    validations:
      required: true

  - type: textarea
    id: formula_impact
    attributes:
      label: Formula impact
      description: If this changes S / T / ΔS for any file, describe the direction and magnitude. Skip if it doesn't touch the formula.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you think about, and why did you discard it?
    validations:
      required: false
