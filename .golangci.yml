version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - gocognit
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - revive
    - staticcheck
    - unused
    - whitespace
  settings:
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocognit
          - gocyclo
          - gosec
        path: _test\.go
      - linters:
          - errcheck
          - gocognit
          - gocyclo
          - gosec
          - unused
        path: testdata/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
